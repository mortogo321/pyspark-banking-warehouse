name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run --locked ruff check src tests jobs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyspark 4.2.0 declares support for within requires-python.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --locked pytest -v tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Spark image
        run: docker build -f docker/Dockerfile -t pyspark-banking-warehouse:spark .

      - name: Validate compose config
        run: docker compose config
