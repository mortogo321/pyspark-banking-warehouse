services:
  localstack:
    # Pinned to the last community-edition release: newer "latest" tags merge
    # community/pro into one image that requires a LOCALSTACK_AUTH_TOKEN,
    # which this showcase has no business needing (S3-only, no pro features).
    image: localstack/localstack:4.4.0
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - localstack_data:/var/lib/localstack

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-warehouse}
      - POSTGRES_USER=${POSTGRES_USER:-warehouse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-warehouse}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      # Postgres 18+ images store data under a major-version subdirectory of
      # /var/lib/postgresql itself; mounting .../data directly (the pre-18
      # convention) makes the entrypoint refuse to start.
      - postgres_data:/var/lib/postgresql
      - ./sql/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - S3_ENDPOINT=http://localstack:4566
      - S3_BUCKET=${S3_BUCKET:-lake}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-warehouse}
      - POSTGRES_USER=${POSTGRES_USER:-warehouse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-warehouse}
      - CTR_THRESHOLD=${CTR_THRESHOLD:-2000000}
      - RANDOM_SEED=${RANDOM_SEED:-42}
      - NUM_CUSTOMERS=${NUM_CUSTOMERS:-2000}
      - NUM_ACCOUNTS=${NUM_ACCOUNTS:-3000}
      - NUM_TRANSACTIONS=${NUM_TRANSACTIONS:-60000}
      - DATA_END_DATE=${DATA_END_DATE:-2026-06-30}
      - DATA_WINDOW_DAYS=${DATA_WINDOW_DAYS:-90}
      - LOCAL_REPORTS_DIR=/workspace/data/reports
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
    working_dir: /workspace

  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["python3", "-m", "pytest", "-v", "tests/"]

volumes:
  localstack_data:
  postgres_data:
